<!DOCTYPE html>
<html>
<head>
<title>Page Title</title>
<style>
body
{
display: flex;
justify-content: center;
background-color: lightgrey;

}
button
{
width: 50px;
}
.container
{
display: flex;
flex-direction: column;
align-items: center;
}
.znaki
{
display: flex;
flex-wrap: wrap;
width: 220px;
gap: 5px;
position: relative;
left: 2px;
}
button
{
border-radius: 6px;
border: 0px;
height: 30px;
font-size: 20px;
}
button:hover
{
background-color: darkgrey;
}
input
{
width: 90%;
margin-top: 20px;
border-radius: 6px;
border: 0px;
height: 30px;
font-family: Arial;
font-size: 20px;
}
.obudowa
{
margin-top:20px;
display: block;
background-color: grey;
padding: 20px;
border-radius: 4px;
}
</style>
</head>

<body>
<div class="obudowa">
<div class="container">
<input type="text", id="ekran" readonly>

<br>
<div class="znaki">
<button onclick="wpiszNaEkran(1)">1</button>
<button onclick="wpiszNaEkran(2)">2</button>
<button onclick="wpiszNaEkran(3)">3</button>
<button onclick="wybierzDzialanie(1)">+</button>
<button onclick="wpiszNaEkran(4)">4</button>
<button onclick="wpiszNaEkran(5)">5</button>
<button onclick="wpiszNaEkran(6)">6</button>
<button onclick="wybierzDzialanie(2)">-</button>
<button onclick="wpiszNaEkran(7)">7</button>
<button onclick="wpiszNaEkran(8)">8</button>
<button onclick="wpiszNaEkran(9)">9</button>
<button onclick="wybierzDzialanie(3)">*</button>
<button onclick="wyczysc()">C</button>
<button onclick="wpiszNaEkran(0)">0</button>
<button onclick="wypiszWynik()">=</button>
<button onclick="wybierzDzialanie(4)">/</button>


</div>
</div>
</div>
</body>
<script>
var liczbaNaEkranie = document.getElementById("ekran");
var pierwszaLiczba = 0;
var wynik = 0;
var dzialanie=0;
var nowaLiczba= false;
function wpiszNaEkran(liczba)
{
	if(liczbaNaEkranie.value==0||nowaLiczba)
	{
		nowaLiczba=false;
		liczbaNaEkranie.value = liczba;
	}
	else liczbaNaEkranie.value += liczba;
}
function wybierzDzialanie(x)
{
	if(liczbaNaEkranie.value=="")
    {
    	dzialanie=x;
    	return;
    }
	pierwszaLiczba=Number(liczbaNaEkranie.value);
    if(dzialanie==0)
    {
    	wynik=pierwszaLiczba;
    }
	else if(dzialanie==1)
    {
    	
    	wynik=wynik+pierwszaLiczba;
        dzialanie=1;
    }
    else if(dzialanie==2)
    {
    	wynik=wynik-pierwszaLiczba;
        dzialanie=2;
    }
    else if(dzialanie==3)
    {
    	wynik=wynik*pierwszaLiczba;
        dzialanie=3;
    }
    else if(dzialanie==4)
    {
    	wynik=wynik/pierwszaLiczba;
        dzialanie=4;
    }
    liczbaNaEkranie.value = wynik;
	nowaLiczba=true;
    dzialanie=x;
}
function wypiszWynik()
{
	if(dzialanie==1)
    {
    	wynik=wynik+Number(liczbaNaEkranie.value);
    }
    if(dzialanie==2)
    {
    	wynik=wynik-Number(liczbaNaEkranie.value);
    }
    if(dzialanie==3)
    {
    	wynik=wynik*Number(liczbaNaEkranie.value);
    }
    if(dzialanie==4)
    {
    	wynik=wynik/Number(liczbaNaEkranie.value);
    }
	liczbaNaEkranie.value = wynik;
    dzialanie=0;
}
function wyczysc()
{
    pierwszaLiczba = 0;
    wynik = 0;
    dzialanie=0;
    liczbaNaEkranie.value = "";
	nowaLiczba=false;
}
</script>
</html>
